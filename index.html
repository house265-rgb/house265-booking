<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>House 265 — จองคิวต่อผม</title>
<!-- ไปหน้าจองทันที · เผื่อ JS ปิดอยู่ก็ยังเด้งด้วย meta refresh -->
<meta http-equiv="refresh" content="0; url=Booking.html">
<link rel="canonical" href="Booking.html">
<style>
  :root{ color-scheme: dark; --bg:#1a1816; --fg:#f3ece1; --gold:#b09036; --faint:#9b9186; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:"Noto Sans Thai","Helvetica Neue",Arial,sans-serif;
       display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  .box{max-width:420px}
  .logo{font-size:26px;font-weight:700;letter-spacing:.5px;color:var(--gold);margin:0 0 6px}
  .sub{font-size:15px;color:var(--faint);margin:0 0 22px}
  .dots{display:flex;gap:7px;justify-content:center;margin-bottom:22px}
  .dots i{width:8px;height:8px;border-radius:50%;background:var(--gold);opacity:.3;
          animation:b 1.1s infinite ease-in-out}
  .dots i:nth-child(2){animation-delay:.16s} .dots i:nth-child(3){animation-delay:.32s}
  @keyframes b{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-5px)}}
  a.btn{display:inline-block;padding:13px 26px;border-radius:12px;text-decoration:none;
        background:var(--gold);color:#1a1816;font-weight:700;font-size:16px}
  .note{margin-top:16px;font-size:13px;color:var(--faint)}
  @media (prefers-reduced-motion:reduce){ .dots i{animation:none;opacity:.6} }
</style>
</head>
<body>
  <div class="box">
    <p class="logo">HOUSE 265</p>
    <p class="sub">กำลังพาไปหน้าจองคิว…</p>
    <div class="dots"><i></i><i></i><i></i></div>
    <a class="btn" href="Booking.html">เปิดหน้าจองคิว</a>
    <p class="note">ถ้าหน้านี้ค้างอยู่ ให้กดปุ่มด้านบน</p>
  </div>
<script>location.replace('Booking.html');</script>
</body>
</html>
