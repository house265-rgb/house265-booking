  if(RS.start){ h+='<div class="rsdiff">'+esc(b.date)+' '+esc(b.start)+'  →  <b>'+esc(RS.date)+' '+esc(RS.start)+'</b></div>'; }
  h+='<button class="btn" id="rsGo" style="margin-top:12px" onclick="doResched()" disabled>ยืนยันเลื่อนคิว</button>'+
     '<button class="btn sec" style="margin-top:8px" onclick="rsBack()">ย้อนกลับ</button>';
  box.innerHTML=h; rsFeeHint(); rsValid(); }
function rsFeeHint(){ var el=document.getElementById('rsFeeHint'); if(!el||!RS||!RS.booking) return;
  var dep=Number(RS.booking.deposit)||0, f=Number((document.getElementById('rsFee')||{}).value)||0;
  el.innerHTML = f>0 ? ('ลูกค้าเหลือมัดจำใช้ได้ <b>฿'+fmt(Math.max(0,dep-f))+'</b> จาก ฿'+fmt(dep))
                     : ('ยกยอดมัดจำ <b>฿'+fmt(dep)+'</b> ไปคิวใหม่ทั้งหมด'); }
function rsValid(){ var btn=document.getElementById('rsGo'); if(!btn||!RS) return;
  var ok=!!RS.start && !!String((document.getElementById('rsReason')||{}).value||'').trim();
  btn.disabled=!ok; btn.style.opacity=ok?'1':'.5'; }
function rsPickSlip(inp){ var f=inp.files&&inp.files[0]; if(!f) return;
  if(f.size>6*1024*1024){ toast('ไฟล์ใหญ่เกิน 6MB',1); inp.value=''; return; }
  var rd=new FileReader();
  rd.onload=function(){ RSSLIP=rd.result;
    var el=document.getElementById('rsSlipName'); if(el) el.innerHTML='✓ แนบแล้ว: '+esc(f.name); };
  rd.readAsDataURL(f); }
function rsMakeQR(){ var amt=Number((document.getElementById('rsTopup')||{}).value)||0;
  var box=document.getElementById('rsQRBox'); if(!box) return;
  if(!(amt>0)){ box.innerHTML='<div class="mini" style="color:var(--crit)">ใส่ยอดที่จะให้ลูกค้าโอนก่อน</div>'; return; }
  box.innerHTML='<div class="mini">กำลังสร้าง QR…</div>';
  api('payQR',{amount:amt}).then(function(r){
    if(!r||!r.ok){ box.innerHTML='<div class="mini" style="color:var(--crit)">'+esc((r&&r.message)||'สร้าง QR ไม่สำเร็จ')+'</div>'; return; }
    box.innerHTML='<div id="rsQRImg" style="display:inline-block;background:#fff;padding:10px;border-radius:10px"></div>'+
      '<div class="mini" style="margin-top:6px">สแกนเพื่อโอน <b style="color:var(--gold-soft)">฿'+fmt(r.data.amount)+'</b></div>';
    var el=document.getElementById('rsQRImg');
    if(typeof QRCode==='undefined'){ el.innerHTML='<div class="mini" style="color:var(--crit)">โหลดตัวสร้าง QR ไม่สำเร็จ</div>'; return; }
    new QRCode(el,{text:r.data.payload,width:200,height:200,correctLevel:QRCode.CorrectLevel.M});
  }).catch(function(){ box.innerHTML='<div class="mini" style="color:var(--crit)">เชื่อมต่อไม่สำเร็จ</div>'; }); }
function doResched(){ if(!RS||!RS.start) return;
  var reason=String((document.getElementById('rsReason')||{}).value||'').trim();
  if(!reason){ toast('ใส่เหตุผลที่เลื่อน',1); return; }
  var fee=Number((document.getElementById('rsFee')||{}).value)||0;
  var topup=Number((document.getElementById('rsTopup')||{}).value)||0;
  api('rescheduleBooking',{booking_id:RS.id,date:RS.date,start:RS.start,tech_id:(RS.tech||'any'),reason:reason,forfeit:fee,
    new_deposit:topup, new_slip_data_url:(topup>0?(RSSLIP||''):'')})
    .then(function(r){ if(!r||!r.ok){ toast((r&&r.message)||'เลื่อนไม่สำเร็จ',1); return; }
      var d=r.data; toast('เลื่อนคิวแล้ว · '+d.to.date+' '+d.to.start+(d.forfeit>0?(' · หักมัดจำ ฿'+fmt(d.forfeit)):' · ไม่หักมัดจำ'));
      RS=null; RSSLIP=null; closeLine(); loadQueue(); })
    .catch(function(){ toast('เชื่อมต่อไม่สำเร็จ',1); }); }

/* ---- ลูกค้าผิดนัด ----
 * ค่าคอมคิดที่เซิร์ฟเวอร์เสมอ หน้าเว็บแค่แสดง (กฎเดียวกับราคาจอง) */
var QNOSHOW=null;
function openNoShow(){ if(!QBK)return;
  QNOSHOW={loading:true,quote:null,tech:String(QBK.tech_id||'')};
  renderQueueActions();
  api('noShowQuote',{booking_id:QBK.booking_id}).then(function(r){
    if(!r||!r.ok){ QNOSHOW=null; toast((r&&r.message)||'ดึงข้อมูลไม่สำเร็จ',1); renderQueueActions(); return; }
    QNOSHOW.loading=false; QNOSHOW.quote=r.data;
    if(!QNOSHOW.tech) QNOSHOW.tech=String(r.data.tech_id||'');
    renderQueueActions();
  }).catch(function(){ QNOSHOW=null; toast('เชื่อมต่อไม่สำเร็จ',1); renderQueueActions(); }); }
function closeNoShow(){ QNOSHOW=null; renderQueueActions(); }
function nsTech(v){ if(QNOSHOW){ QNOSHOW.tech=v; } }
function renderNoShow(){
  var w=document.getElementById('qAct'); if(!w) return;
  if(QNOSHOW.loading){ w.innerHTML='<div class="mini" style="text-align:center">กำลังคำนวณค่าคอม…</div>'; return; }
  /* ⚠ bootstrap ส่งมาในชื่อ technicians — เดิมอ่าน DATA.techs จึงได้ลิสต์ว่างตลอด เลือกช่างไม่ได้เลย */
  var q=QNOSHOW.quote, techs=((DATA&&DATA.technicians)||[]).filter(function(t){ return String(t.name||'').trim(); });
  var h='<div class="warn" style="margin-bottom:10px">บันทึกว่า<b>ลูกค้าไม่มาตามนัด</b> — ร้านยึดมัดจำ ช่างได้ค่าคอมตามเกณฑ์</div>';
  h+='<label class="lbl">ช่างที่ได้ค่าคอม</label>';
  h+= techs.length
    ? ('<select class="in" onchange="nsTech(this.value)"><option value="">— เลือกช่าง —</option>'+
       techs.map(function(t){ return '<option value="'+esc(t.tech_id)+'"'+(String(t.tech_id)===String(QNOSHOW.tech)?' selected':'')+'>'+esc(t.name)+'</option>'; }).join('')+'</select>')
    : '<div class="warn" style="margin:0">ยังไม่มีรายชื่อช่างในระบบ — ให้ผู้จัดการเพิ่มช่างก่อน</div>';
  h+='<div style="margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg2)">'+
     '<div style="display:flex;justify-content:space-between;align-items:baseline"><span class="mini" style="margin:0">ค่าคอมที่ช่างได้</span>'+
     '<b style="font-size:22px;color:var(--gold-soft)">'+fmt(q.comm)+' ฿</b></div>'+
     '<div class="mini" style="margin:4px 0 0">'+esc(q.comm_label||'')+'</div>'+
     (q.comm_note?('<div class="mini" style="margin:2px 0 0;color:var(--faint)">'+esc(q.comm_note)+'</div>'):'')+
     /* ยอดฝั่งร้านโชว์เฉพาะตอนติดลบ — ปกติพนักงานไม่ต้องเห็นว่าร้านได้เท่าไหร่ */
     (Number(q.shop)<0
       ? ('<div style="border-top:1px solid var(--line);margin:9px 0 7px"></div>'+
          '<div class="mini" style="margin:0;color:var(--crit)">มัดจำ <b>'+fmt(q.deposit)+'</b> ฿ ไม่พอจ่ายค่าคอม · <b>ร้านรับส่วนขาด '+fmt(Math.abs(q.shop))+' ฿</b></div>')
       : '')+'</div>';
  if(Number(q.shop)<0) h+='<div class="mini" style="margin-top:8px;color:var(--crit)">⚠ ช่างยังได้ค่าคอมเต็มจำนวน ส่วนที่ขาดร้านรับเอง</div>';
  h+='<label class="lbl" style="margin-top:10px">เหตุผล (ไม่บังคับ)</label>'+
     '<input class="in" id="nsReason" placeholder="เช่น โทรไม่รับ / แจ้งยกเลิกกระชั้น">';
  h+='<div class="row2" style="margin-top:12px"><button class="btn sec" onclick="closeNoShow()">ย้อนกลับ</button>'+
     '<button class="btn" style="background:var(--crit);color:#fff" onclick="doNoShow()">ยืนยันผิดนัด</button></div>';
  w.innerHTML=h; }
function doNoShow(){ if(!QNOSHOW||!QBK)return;
  var reason=String((document.getElementById('nsReason')||{}).value||'').trim();
  api('markNoShow',{booking_id:QBK.booking_id,tech_id:QNOSHOW.tech,reason:reason}).then(function(r){
    if(!r||!r.ok){ toast((r&&r.message)||'บันทึกไม่สำเร็จ',1); return; }
    var d=r.data;
    QNOSHOW=null; closeLine();
    toast('บันทึกผิดนัดแล้ว · ค่าคอม '+fmt(d.comm)+' ฿ รออนุมัติ');
    loadQueue();
  }).catch(function(){ toast('เชื่อมต่อไม่สำเร็จ',1); }); }
function doCancelBooking(){ if(!QBK)return; var id=QBK.booking_id;
  api('cancelBooking',{booking_id:id}).then(function(r){ if(!r||!r.ok){ toast((r&&r.message)||'ยกเลิกไม่สำเร็จ',1); return; }
    QCANCEL=false; closeLine(); toast('ยกเลิกคิวแล้ว · คืนสต็อก'); loadQueue(); }).catch(function(){ toast('เชื่อมต่อไม่สำเร็จ',1); }); }
/* เช็คเอาต์คิว: ไม่ยัดรายการตายตัว — สร้าง "ไกด์ไลน์ตามที่จอง" ให้พนักงานหยิบของจริง/สแกน QR + คีย์เอง (แก้ได้ทุกอย่างหน้างาน) */
function checkoutToCart(bk,v){ if(!bk)return;
  var qty=Math.max(1,Math.round(Number(bk.qty_mad)||1)); QGUIDE=[]; QGTECH='';
  var bookedTech=(bk.tech_name||bk.tech_id||''); QGTECH=bookedTech;
  var defTech=[{name:(bookedTech||USERTECH||''),split:100}];
  /* รายการหลัก */
  if(bk.variant_id){ var ht=(v&&v.hair_type)||'', len=String((v&&v.length_in)||bk.size||''), technique=techniqueFor(ht);
    var perMad=laborFor(technique,len)||0; if(!perMad && Number(bk.suggest_total)&&qty) perMad=Math.round(Number(bk.suggest_total)/qty);
    QGUIDE.push({ type:'ต่อผม (ใช้ผมของร้าน)', scan:true, line:{ kind:'product', variant_id:bk.variant_id, barcode:'', name:(v&&v.name)||('ต่อผม '+ht),
      hair_type:ht, length_in:len, color:(v&&v.color)||'', grade:(v&&v.grade)||'', texture:(v&&v.texture)||'', plainPrice:perMad, extPrice:perMad, cost:null,
      strands_per_mad:(v&&Number(v.strands_per_mad))||0,
      mode:'ext', technique:technique, size:sizeLabelFor(technique,len), techs:defTech.slice(), qty_mad:qty } });
  } else { var svc=svcById(bk.service_id)||svcByAcct(bk.detail)||{}; var it=svc.acct_name||bk.service_id||'บริการต่อผม';
    var bb=Number(svc.byob_base)||0, bp=Number(svc.byob_per_bundle)||0; var bprice=Math.round(bb+bp*qty)||Math.round(Number(bk.suggest_total)||0); /* คิดจากสูตร byob ไม่ใช้ค่าประเมินเก่า */
    QGUIDE.push({ type:'byob', scan:false, line:{ kind:'service', item:it, size:String(bk.size||''), color:colorNm(bk.color_id), qty:qty, unit:0, price:bprice, byobBase:bb, byobPer:bp, technique:it, techs:defTech.slice() } }); }
  /* ซื้อผมเพิ่ม */
  if(bk.addon_variant_id){ var av=bk.addon_variant||{}, aq=Math.max(1,Math.round(Number(bk.addon_qty)||1)), aht=av.hair_type||'', alen=String(av.length_in||''), atech=techniqueFor(aht);
    var aprice=laborFor(atech,alen)||0;
    QGUIDE.push({ type:'ซื้อผมเพิ่ม (ใช้ผมของร้าน)', scan:true, line:{ kind:'product', variant_id:bk.addon_variant_id, barcode:'', name:(av.name||('ผมซื้อเพิ่ม '+aht)),
      hair_type:aht, length_in:alen, color:av.color||'', grade:av.grade||'', texture:av.texture||'', plainPrice:aprice, extPrice:aprice, cost:null,
      strands_per_mad:Number(av.strands_per_mad)||0,
      mode:'plain', technique:atech, size:sizeLabelFor(atech,alen), techs:defTech.slice(), qty_mad:aq } }); }
  /* ถอดผมเก่า */
  if(bk.rm_addon_id){ var rma=bk.rm_addon||{}, rmrow=(DATA.removals||[]).filter(function(x){return String(x.removal_id)===String(bk.rm_addon_id);})[0]||{};
    QGUIDE.push({ type:'ถอดผมเก่า', scan:false, line:{ kind:'removal', item:String(rma.name||rmrow.name||'ถอดผม'), qty:1, price:Math.round(Number(rma.price!=null?rma.price:rmrow.price)||0), techs:defTech.slice(), size:'' } }); }
  CART=[]; window._bookingId=bk.booking_id; window._bookingName=(bk.name||'')+(bk.phone?(' · '+bk.phone):''); window._deposit=Math.round(Number(bk.deposit)||0);
  window._promoId=''; window._recv=0; window._split=false; window._p2a=0; window._slips=[]; PAY='เงินสด';
  closeLine(); setPage('Sale'); renderCart();
  var cn=document.getElementById('cName'); if(cn)cn.value=bk.name||''; var cp=document.getElementById('cPhone'); if(cp)cp.value=bk.phone||'';
  toast('ดึงคิวแล้ว · หยิบของจริง/สแกน QR ตามไกด์ไลน์ แล้วเลือกช่าง'); }
/* ไกด์ไลน์ตามจอง (อ้างอิง) — โชว์เหนือบิล · กด "เพิ่ม" เพื่อนำลงบิล แล้วแก้/สแกนทับได้ */
/* ลำดับที่พนักงานต้องรู้ก่อนเป็นอันดับแรกคือ "ใช้ผมของร้าน" หรือ "นำผมมาเอง"
 * เพราะเป็นตัวตัดสินว่าต้องเดินไปหยิบผม+สแกน QR หรือไม่ จึงขึ้นหน้าสุดและตัดคำอธิบายทิ้ง
 * ตัวอย่าง: ใช้ผมของร้าน : ขนนก : 30นิ้ว : เกรด ตัดสด : ผมตรงธรรมชาติ : สี ดำธรรมชาติ : 300 ช่อ */
function guideSpec(g){ var l=g.line, p=[];
  if(l.kind==='product'){ p.push(g.scan?'ใช้ผมของร้าน':'นำผมมาเอง'); p.push(l.hair_type||l.name);
    if(l.length_in)p.push(l.length_in+'นิ้ว'); if(l.grade)p.push('เกรด '+l.grade); if(l.texture)p.push(l.texture); if(l.color)p.push('สี '+l.color);
    p.push(qtyTag(l.hair_type,Math.round(l.qty_mad||1),lineStrands(l))); }
  else if(l.kind==='removal'){ p.push(l.item); p.push(qtyTag(l.technique||l.item,l.qty||1)); }
  else if(l.kind==='comb'){ p.push('ปั้นช่อให้ลูกค้า'); p.push(l.technique||l.item); p.push(qtyTag(l.technique||l.item,l.qty||1,lineStrands(l))); }
  else { p.push('นำผมมาเอง'); p.push(l.technique||l.item); if(l.size)p.push(l.size); if(l.color)p.push('สี '+l.color); p.push(qtyTag(l.technique||l.item,l.qty||1)); }
  return p.filter(Boolean).join(' : '); }
function guideCardHtml(){ if(!QGUIDE.length)return '';
  var rows=QGUIDE.map(function(g){ return '<div style="display:flex;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)">'+
    '<div style="flex:1;min-width:0;font-size:12.5px;line-height:1.5">'+esc(guideSpec(g))+'</div>'+
    '<div class="mono" style="color:var(--gold-soft);white-space:nowrap">'+fmt(lineTotal(g.line))+'</div></div>'; }).join('');
  var sum=QGUIDE.reduce(function(a,g){return a+lineTotal(g.line);},0);
  return '<div style="margin-bottom:10px;padding:12px;background:var(--bg2);border:1px solid var(--gold-dim);border-radius:12px">'+
    '<div style="display:flex;justify-content:space-between;align-items:baseline"><b style="color:var(--gold-soft);font-size:14px">📋 รายละเอียดการจอง</b>'+(QGTECH?('<span class="mini">ช่าง <b style="color:var(--gold-soft)">'+esc(QGTECH)+'</b></span>'):'')+'</div>'+
    '<div style="display:flex;gap:8px;font-size:10px;color:var(--faint);padding-top:6px;text-transform:uppercase;letter-spacing:.04em"><div style="flex:1">รายการ</div><div>มูลค่าประเมิน</div></div>'+
    rows+
    '<div style="display:flex;gap:8px;align-items:center;padding:9px 0 2px;border-top:2px solid var(--gold-dim);margin-top:2px"><b style="flex:1;color:var(--gold-soft)">รวมประเมิน</b><b class="mono" style="color:var(--gold-soft)">'+fmt(sum)+'</b></div>'+
    '<div class="mini" style="margin-top:6px;color:var(--faint)">ℹ️ ไกด์ไลน์สำหรับตรวจสอบเท่านั้น — สแกน QR หรือเลือกจากเมนูเพื่อลงบิลจริง</div></div>'; }
function guideAdd(i){ var g=QGUIDE[i]; if(!g)return; CART.push(JSON.parse(JSON.stringify(g.line))); renderCart(); toast('เพิ่มลงบิลแล้ว · แตะเพื่อแก้ไข/เลือกช่าง'); }
function guideAddAll(){ QGUIDE.forEach(function(g){ CART.push(JSON.parse(JSON.stringify(g.line))); }); renderCart(); toast('เพิ่มทั้งหมดแล้ว · ตรวจของจริง/เลือกช่าง'); }
function detachBooking(){ window._bookingId=''; window._bookingName=''; window._deposit=0; window._promoName=''; QGUIDE=[]; QGTECH=''; renderCart(); toast('ยกเลิกการผูกคิวกับบิลนี้'); }
</script>
<div id="printArea" aria-hidden="true"></div>
